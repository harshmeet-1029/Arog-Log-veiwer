name: Build All Platforms

on:
  workflow_dispatch:  # MANUAL TRIGGER ONLY - You click a button, no auto-runs
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      create_release:
        description: 'Create GitHub Release?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write  # Required to create releases and upload assets

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Update version in pyproject.toml and installer script
      shell: bash
      run: |
        echo "📝 Updating version to ${{ github.event.inputs.version }}"
        sed -i 's/^version = ".*"/version = "${{ github.event.inputs.version }}"/' pyproject.toml
        sed -i 's/#define MyAppVersion ".*"/#define MyAppVersion "${{ github.event.inputs.version }}"/' installer_windows.iss
        echo "✅ Version updated in pyproject.toml and installer_windows.iss"
        grep "^version" pyproject.toml
        grep "MyAppVersion" installer_windows.iss
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Generate build metadata for Windows Portable
      shell: bash
      run: |
        echo "📝 Generating build metadata for Windows Portable..."
        cat > app/build_metadata.py << EOF
        """
        Build metadata - Auto-generated during build process.
        DO NOT EDIT MANUALLY.
        """
        PLATFORM = "windows"
        PACKAGE_TYPE = "portable"
        ARCHITECTURE = "amd64"
        BUILD_DATE = "${{ github.event.inputs.version }}"
        VERSION = "${{ github.event.inputs.version }}"
        EOF
        echo "✅ Build metadata generated for Windows Portable"
        cat app/build_metadata.py
    
    - name: Build Windows Portable executable
      run: |
        pyinstaller --name="ArgoLogViewer-Portable" `
          --onefile `
          --windowed `
          --add-data="app;app" `
          --hidden-import=PySide6 `
          --hidden-import=paramiko `
          --hidden-import=cryptography `
          --hidden-import=app.build_metadata `
          --icon=app/icon.ico `
          --clean `
          app/main.py
    
    - name: Create portable version
      run: |
        Copy-Item "dist\ArgoLogViewer-Portable.exe" "ArgoLogViewer-v${{ github.event.inputs.version }}-Windows-Portable.exe"
        echo "✅ Portable version created"
    
    - name: Install Inno Setup
      run: |
        choco install innosetup -y
        echo "✅ Inno Setup installed"
    
    - name: Generate build metadata for Windows Installer
      shell: bash
      run: |
        echo "📝 Regenerating build metadata for Windows Installer..."
        cat > app/build_metadata.py << EOF
        """
        Build metadata - Auto-generated during build process.
        DO NOT EDIT MANUALLY.
        """
        PLATFORM = "windows"
        PACKAGE_TYPE = "installer"
        ARCHITECTURE = "amd64"
        BUILD_DATE = "${{ github.event.inputs.version }}"
        VERSION = "${{ github.event.inputs.version }}"
        EOF
        echo "✅ Build metadata updated for Windows Installer"
    
    - name: Build Windows Installer executable (second build with installer metadata)
      run: |
        pyinstaller --name="ArgoLogViewer-Installer" `
          --onedir `
          --windowed `
          --add-data="app;app" `
          --hidden-import=PySide6 `
          --hidden-import=paramiko `
          --hidden-import=cryptography `
          --hidden-import=app.build_metadata `
          --icon=app/icon.ico `
          --clean `
          app/main.py
        echo "✅ Second build complete (onedir, installer metadata baked in)"
    
    - name: Build Windows Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_windows.iss
        echo "✅ Windows installer created"
    
    - name: Rename installer with version
      run: |
        $installerPath = Get-ChildItem -Path "installers\windows\ArgoLogViewer-*-Windows-Setup.exe" | Select-Object -First 1
        if ($installerPath) {
          Copy-Item $installerPath.FullName "ArgoLogViewer-v${{ github.event.inputs.version }}-Windows-Installer.exe"
          echo "✅ Installer renamed"
        }
    
    - name: Generate checksums
      run: |
        $portable = Get-FileHash -Algorithm SHA256 "ArgoLogViewer-v${{ github.event.inputs.version }}-Windows-Portable.exe"
        $installer = Get-FileHash -Algorithm SHA256 "ArgoLogViewer-v${{ github.event.inputs.version }}-Windows-Installer.exe"
        "$($portable.Hash)  ArgoLogViewer-v${{ github.event.inputs.version }}-Windows-Portable.exe" | Out-File -Encoding ASCII checksums-windows.txt
        "$($installer.Hash)  ArgoLogViewer-v${{ github.event.inputs.version }}-Windows-Installer.exe" | Add-Content -Encoding ASCII checksums-windows.txt
        echo "✅ Checksums generated"
    
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ArgoLogViewer-Windows
        path: |
          ArgoLogViewer-v${{ github.event.inputs.version }}-Windows-Portable.exe
          ArgoLogViewer-v${{ github.event.inputs.version }}-Windows-Installer.exe
          checksums-windows.txt

  build-macos-arm:
    # Build Apple Silicon (arm64) binary
    runs-on: macos-latest  # Apple Silicon runner
    steps:
    - uses: actions/checkout@v4
    
    - name: Update version in pyproject.toml
      run: |
        echo "📝 Updating version to ${{ github.event.inputs.version }}"
        sed -i '' 's/^version = ".*"/version = "${{ github.event.inputs.version }}"/' pyproject.toml
        echo "✅ Version updated in pyproject.toml"
        grep "^version" pyproject.toml
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        echo "📦 Installing pip packages for Apple Silicon build..."
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        echo "✅ Dependencies installed"
    
    - name: Create macOS icon (.icns)
      run: |
        echo "🎨 Creating .icns icon for macOS..."
        mkdir -p app/icon.iconset
        sips -z 16 16 app/ICON.png --out app/icon.iconset/icon_16x16.png
        sips -z 32 32 app/ICON.png --out app/icon.iconset/icon_16x16@2x.png
        sips -z 32 32 app/ICON.png --out app/icon.iconset/icon_32x32.png
        sips -z 64 64 app/ICON.png --out app/icon.iconset/icon_32x32@2x.png
        sips -z 128 128 app/ICON.png --out app/icon.iconset/icon_128x128.png
        sips -z 256 256 app/ICON.png --out app/icon.iconset/icon_128x128@2x.png
        sips -z 256 256 app/ICON.png --out app/icon.iconset/icon_256x256.png
        sips -z 512 512 app/ICON.png --out app/icon.iconset/icon_256x256@2x.png
        sips -z 512 512 app/ICON.png --out app/icon.iconset/icon_512x512.png
        sips -z 1024 1024 app/ICON.png --out app/icon.iconset/icon_512x512@2x.png
        iconutil -c icns app/icon.iconset -o app/icon.icns
        rm -rf app/icon.iconset
        echo "✅ Icon created: app/icon.icns"
    
    - name: Generate build metadata for macOS Apple Silicon
      run: |
        echo "📝 Generating build metadata for macOS Apple Silicon..."
        cat > app/build_metadata.py << EOF
        """
        Build metadata - Auto-generated during build process.
        DO NOT EDIT MANUALLY.
        """
        PLATFORM = "macos"
        PACKAGE_TYPE = "dmg"
        ARCHITECTURE = "arm64"
        BUILD_DATE = "${{ github.event.inputs.version }}"
        VERSION = "${{ github.event.inputs.version }}"
        EOF
        echo "✅ Build metadata generated for macOS Apple Silicon"
        cat app/build_metadata.py
    
    - name: Build macOS Apple Silicon app (DMG variant)
      run: |
        export MACOSX_DEPLOYMENT_TARGET=11.0
        
        echo "🔨 Building Apple Silicon (arm64) app with PyInstaller (DMG variant)..."
        echo "📋 Deployment target: macOS 11.0 Big Sur and later (including Sonoma)"
        python -m PyInstaller --name="ArgoLogViewer-Installer" \
          --windowed \
          --onedir \
          --icon="app/icon.icns" \
          --add-data="app:app" \
          --hidden-import=PySide6 \
          --hidden-import=paramiko \
          --hidden-import=cryptography \
          --hidden-import=app.build_metadata \
          --clean \
          --osx-bundle-identifier=com.harshmeetsingh.argologviewer \
          --target-arch arm64 \
          --codesign-identity - \
          app/main.py
        
        # Rename .app bundle to standard name
        mv dist/ArgoLogViewer-Installer.app dist/ArgoLogViewer.app
        
        echo ""
        echo "🔧 Fixing code signatures..."
        
        # Remove all code signatures to prevent Team ID mismatches
        sudo codesign --remove-signature dist/ArgoLogViewer.app/Contents/MacOS/ArgoLogViewer-Installer 2>/dev/null || true
        
        # Re-sign with consistent ad-hoc signature
        sudo codesign -s - --deep --force dist/ArgoLogViewer.app
        
        echo "✅ Code signatures fixed"
    
    - name: Verify Apple Silicon binary
      run: |
        echo "🔍 Verifying Apple Silicon build..."
        EXECUTABLE="dist/ArgoLogViewer.app/Contents/MacOS/ArgoLogViewer-Installer"
        
        if [ ! -f "$EXECUTABLE" ]; then
          echo "❌ ERROR: Executable not found"
          exit 1
        fi
        
        lipo -info "$EXECUTABLE"
        
        if lipo -info "$EXECUTABLE" | grep -q "arm64"; then
          echo "✅ SUCCESS: Binary is Apple Silicon arm64!"
          echo "   ✓ Native support for M1, M2, M3, M4"
          echo "   ✓ Compatible with macOS 11.0+ (Big Sur, Monterey, Ventura, Sonoma)"
        else
          echo "❌ ERROR: Binary is not arm64!"
          exit 1
        fi
    
    - name: Create Apple Silicon DMG
      run: |
        mkdir -p dist/dmg
        cp -r dist/ArgoLogViewer.app dist/dmg/
        ln -s /Applications dist/dmg/Applications
        hdiutil create -volname "Argo Log Viewer (Apple Silicon)" \
          -srcfolder dist/dmg \
          -ov -format UDZO \
          "ArgoLogViewer-v${{ github.event.inputs.version }}-macOS-AppleSilicon.dmg"
        rm -rf dist/dmg
        echo "✅ DMG created"
    
    - name: Build macOS Apple Silicon app (ZIP/Portable variant)
      run: |
        echo "📝 Regenerating build metadata for macOS ZIP..."
        cat > app/build_metadata.py << EOF
        """
        Build metadata - Auto-generated during build process.
        DO NOT EDIT MANUALLY.
        """
        PLATFORM = "macos"
        PACKAGE_TYPE = "zip"
        ARCHITECTURE = "arm64"
        BUILD_DATE = "${{ github.event.inputs.version }}"
        VERSION = "${{ github.event.inputs.version }}"
        EOF
        echo "✅ Build metadata updated for macOS ZIP"
        
        export MACOSX_DEPLOYMENT_TARGET=11.0
        
        echo "🔨 Building Apple Silicon (arm64) app with PyInstaller (ZIP/Portable variant)..."
        python -m PyInstaller --name="ArgoLogViewer-Portable" \
          --windowed \
          --onedir \
          --icon="app/icon.icns" \
          --add-data="app:app" \
          --hidden-import=PySide6 \
          --hidden-import=paramiko \
          --hidden-import=cryptography \
          --hidden-import=app.build_metadata \
          --clean \
          --osx-bundle-identifier=com.harshmeetsingh.argologviewer \
          --target-arch arm64 \
          --codesign-identity - \
          app/main.py
        
        # Rename .app bundle to standard name
        mv dist/ArgoLogViewer-Portable.app dist/ArgoLogViewer-ZIP.app
        
        # Re-sign
        sudo codesign --remove-signature dist/ArgoLogViewer-ZIP.app/Contents/MacOS/ArgoLogViewer-Portable 2>/dev/null || true
        sudo codesign -s - --deep --force dist/ArgoLogViewer-ZIP.app
        
        echo "✅ ZIP variant built"
    
    - name: Zip Apple Silicon .app
      run: |
        cd dist
        zip -r ../ArgoLogViewer-v${{ github.event.inputs.version }}-macOS-AppleSilicon.zip ArgoLogViewer-ZIP.app
        cd ..
        echo "✅ ZIP created"
    
    - name: Generate Apple Silicon checksums
      run: |
        shasum -a 256 ArgoLogViewer-v${{ github.event.inputs.version }}-macOS-AppleSilicon.dmg > checksums-macos-arm.txt
        shasum -a 256 ArgoLogViewer-v${{ github.event.inputs.version }}-macOS-AppleSilicon.zip >> checksums-macos-arm.txt
    
    - name: Upload macOS Apple Silicon artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ArgoLogViewer-macOS-AppleSilicon
        path: |
          ArgoLogViewer-v${{ github.event.inputs.version }}-macOS-AppleSilicon.dmg
          ArgoLogViewer-v${{ github.event.inputs.version }}-macOS-AppleSilicon.zip
          checksums-macos-arm.txt

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Update version in pyproject.toml
      run: |
        echo "📝 Updating version to ${{ github.event.inputs.version }}"
        sed -i 's/^version = ".*"/version = "${{ github.event.inputs.version }}"/' pyproject.toml
        echo "✅ Version updated in pyproject.toml"
        grep "^version" pyproject.toml
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Generate build metadata for Linux Portable
      run: |
        echo "📝 Generating build metadata for Linux Portable..."
        cat > app/build_metadata.py << EOF
        """
        Build metadata - Auto-generated during build process.
        DO NOT EDIT MANUALLY.
        """
        PLATFORM = "linux"
        PACKAGE_TYPE = "portable"
        ARCHITECTURE = "amd64"
        BUILD_DATE = "${{ github.event.inputs.version }}"
        VERSION = "${{ github.event.inputs.version }}"
        EOF
        echo "✅ Build metadata generated for Linux Portable"
        cat app/build_metadata.py
    
    - name: Build Linux Portable binary
      run: |
        pyinstaller --name="ArgoLogViewer-Portable" \
          --onefile \
          --add-data="app:app" \
          --add-data="app/ICON.png:." \
          --hidden-import=PySide6 \
          --hidden-import=paramiko \
          --hidden-import=cryptography \
          --hidden-import=app.build_metadata \
          --clean \
          app/main.py
    
    - name: Create portable version
      run: |
        mv dist/ArgoLogViewer-Portable ArgoLogViewer-v${{ github.event.inputs.version }}-Linux-Portable
        chmod +x ArgoLogViewer-v${{ github.event.inputs.version }}-Linux-Portable
        echo "✅ Portable version created"
    
    - name: Create DEB package structure
      run: |
        echo "📝 Regenerating build metadata for Linux DEB..."
        cat > app/build_metadata.py << EOF
        """
        Build metadata - Auto-generated during build process.
        DO NOT EDIT MANUALLY.
        """
        PLATFORM = "linux"
        PACKAGE_TYPE = "deb"
        ARCHITECTURE = "amd64"
        BUILD_DATE = "${{ github.event.inputs.version }}"
        VERSION = "${{ github.event.inputs.version }}"
        EOF
        echo "✅ Build metadata updated for Linux DEB"
        
        echo "🔨 Building Linux Installer binary..."
        pyinstaller --name="ArgoLogViewer-Installer" \
          --onefile \
          --add-data="app:app" \
          --hidden-import=PySide6 \
          --hidden-import=paramiko \
          --hidden-import=cryptography \
          --hidden-import=app.build_metadata \
          --clean \
          app/main.py
        echo "✅ Installer binary built"
        
        VERSION="${{ github.event.inputs.version }}"
        DEBDIR="argologviewer_${VERSION}_amd64"
        
        # Create directory structure
        mkdir -p ${DEBDIR}/DEBIAN
        mkdir -p ${DEBDIR}/usr/local/bin
        mkdir -p ${DEBDIR}/usr/share/applications
        mkdir -p ${DEBDIR}/usr/share/icons/hicolor/256x256/apps
        mkdir -p ${DEBDIR}/usr/share/doc/argologviewer
        
        # Copy installer binary (not portable!)
        cp dist/ArgoLogViewer-Installer ${DEBDIR}/usr/local/bin/argologviewer
        chmod +x ${DEBDIR}/usr/local/bin/argologviewer
        
        # Copy .desktop file from repo (app/argologviewer.desktop)
        # Override Exec= to use the installed binary path
        sed 's|^Exec=.*|Exec=/usr/local/bin/argologviewer|' \
          app/argologviewer.desktop > ${DEBDIR}/usr/share/applications/argologviewer.desktop
        
        # Create AppStream metadata so app shows in GNOME Software with uninstall option
        mkdir -p ${DEBDIR}/usr/share/metainfo
        BUILD_DATE=$(date +%Y-%m-%d)
        cat > ${DEBDIR}/usr/share/metainfo/argologviewer.appdata.xml << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <component type="desktop-application">
          <id>argologviewer.desktop</id>
          <name>Argo Log Viewer</name>
          <summary>View Argo Workflow pod logs via SSH</summary>
          <description>
            <p>Argo Log Viewer is a professional desktop application for viewing Argo Workflow logs via SSH. Features include real-time log streaming, pod search, resource monitoring, and Kubernetes operations.</p>
          </description>
          <url type="homepage">https://github.com/harshmeet-1029/Arog-Log-veiwer</url>
          <developer_name>Harshmeet Singh</developer_name>
          <releases>
            <release version="${VERSION}" date="${BUILD_DATE}" />
          </releases>
          <content_rating type="oars-1.1" />
        </component>
        EOF
        
        # Copy icon if exists
        if [ -f "app/ICON.png" ]; then
          cp app/ICON.png ${DEBDIR}/usr/share/icons/hicolor/256x256/apps/argologviewer.png
        fi
        
        # Copy documentation
        cp README.md ${DEBDIR}/usr/share/doc/argologviewer/
        cp LICENSE.txt ${DEBDIR}/usr/share/doc/argologviewer/copyright
        
        # Create control file
        cat > ${DEBDIR}/DEBIAN/control << EOF
        Package: argologviewer
        Version: ${VERSION}
        Section: utils
        Priority: optional
        Architecture: amd64
        Maintainer: Harshmeet Singh <harshmeetsingh010@gmail.com>
        Description: Argo Log Viewer
         Professional desktop application for viewing Argo Workflow logs via SSH.
         Features include real-time log streaming, pod search, and Kubernetes operations.
        Homepage: https://github.com/harshmeet-1029/Arog-Log-veiwer
        EOF
        
        # Create postinst script
        cat > ${DEBDIR}/DEBIAN/postinst << 'EOF'
        #!/bin/bash
        set -e
        
        # Update desktop database
        if command -v update-desktop-database > /dev/null 2>&1; then
          update-desktop-database -q
        fi
        
        # Update icon cache
        if command -v gtk-update-icon-cache > /dev/null 2>&1; then
          gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
        fi
        
        # Update AppStream cache so app shows in GNOME Software
        if command -v appstreamcli > /dev/null 2>&1; then
          appstreamcli refresh --force || true
        fi
        
        echo "Argo Log Viewer installed successfully!"
        echo "Run: argologviewer"
        
        exit 0
        EOF
        
        chmod +x ${DEBDIR}/DEBIAN/postinst
        
        # Create prerm script — kill any running instance before uninstall
        cat > ${DEBDIR}/DEBIAN/prerm << 'EOF'
        #!/bin/bash
        set -e
        
        # Kill running instances before removing.
        # Use -x (exact name match) NOT -f (full cmdline match) — otherwise pkill
        # would also kill the apt/dpkg process running this script.
        pkill -x argologviewer || true
        sleep 1
        
        echo "Removing Argo Log Viewer..."
        
        exit 0
        EOF
        
        chmod +x ${DEBDIR}/DEBIAN/prerm
        
        # Create postrm script (cleanup after uninstall)
        cat > ${DEBDIR}/DEBIAN/postrm << 'EOF'
        #!/bin/bash
        set -e
        
        # Update desktop database
        if command -v update-desktop-database > /dev/null 2>&1; then
          update-desktop-database -q
        fi
        
        # Update icon cache
        if command -v gtk-update-icon-cache > /dev/null 2>&1; then
          gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
        fi
        
        # Refresh AppStream cache
        if command -v appstreamcli > /dev/null 2>&1; then
          appstreamcli refresh --force || true
        fi
        
        echo "Argo Log Viewer uninstalled successfully!"
        
        exit 0
        EOF
        
        chmod +x ${DEBDIR}/DEBIAN/postrm
        
        echo "✅ DEB package structure created"
    
    - name: Build DEB package
      run: |
        VERSION="${{ github.event.inputs.version }}"
        DEBDIR="argologviewer_${VERSION}_amd64"
        
        dpkg-deb --build ${DEBDIR}
        
        mv ${DEBDIR}.deb ArgoLogViewer-v${VERSION}-Linux-Installer.deb
        
        echo "✅ DEB package built"
        echo "Package info:"
        dpkg-deb --info ArgoLogViewer-v${VERSION}-Linux-Installer.deb
    
    - name: Generate checksums
      run: |
        sha256sum ArgoLogViewer-v${{ github.event.inputs.version }}-Linux-Portable > checksums-linux.txt
        sha256sum ArgoLogViewer-v${{ github.event.inputs.version }}-Linux-Installer.deb >> checksums-linux.txt
        echo "✅ Checksums generated"
    
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ArgoLogViewer-Linux
        path: |
          ArgoLogViewer-v${{ github.event.inputs.version }}-Linux-Portable
          ArgoLogViewer-v${{ github.event.inputs.version }}-Linux-Installer.deb
          checksums-linux.txt

  create-release:
    needs: [build-windows, build-macos-arm, build-linux]
    runs-on: ubuntu-latest
    if: github.event.inputs.create_release == 'true'
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Update and commit version
      run: |
        echo "📝 Updating version to ${{ github.event.inputs.version }}"
        sed -i 's/^version = ".*"/version = "${{ github.event.inputs.version }}"/' pyproject.toml
        
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git add pyproject.toml
        git commit -m "Bump version to ${{ github.event.inputs.version }}" || echo "No changes to commit"
        git push origin main || echo "Nothing to push"
        echo "✅ Version committed and pushed"
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Combine checksums
      run: |
        cat ArgoLogViewer-Windows/checksums-windows.txt > CHECKSUMS.txt
        cat ArgoLogViewer-macOS-AppleSilicon/checksums-macos-arm.txt >> CHECKSUMS.txt
        cat ArgoLogViewer-Linux/checksums-linux.txt >> CHECKSUMS.txt
        echo "=== CHECKSUMS ==="
        cat CHECKSUMS.txt
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.event.inputs.version }}
        name: Argo Log Viewer v${{ github.event.inputs.version }}
        body: |
          ## 🚀 Argo Log Viewer v${{ github.event.inputs.version }}
          
          Professional desktop application for viewing Argo Workflow logs via SSH.
          
          ---
          
          ## 💡 Why This Tool Exists
          
          Working with Argo Workflows on Kubernetes clusters often requires navigating through multiple SSH jump servers and executing complex kubectl commands. **Argo Log Viewer eliminates that friction.**
          
          ### 🎯 Problems It Solves
          
          #### 1. **Eliminates Complex SSH Access Chain** 🔗
          
          **Before:** To view logs in real-time, you need to manually run these commands every time:
          ```
          Local Machine 
            → ssh usejump 
              → ssh 10.0.34.231 
                → sudo su - solutions01-prod-us-east-1-eks
                  → kubectl logs commands
          ```
          
          **Now:** Click "Connect" once. Done. ✅
          
          ---
          
          #### 2. **Real-Time Log Streaming** ⚡
          
          **Problem:** `solutions-argo-workflow` web UI shows "Waiting for data..." indefinitely.
          
          **Solution:** Instant real-time log streaming with `kubectl logs -f`.
          
          ---
          
          #### 3. **Easy Log Saving** 💾
          
          **Problem:** Saving logs requires navigating to S3 buckets manually - time-consuming and cumbersome.
          
          **Solution:** One-click log saving while viewing them in real-time.
          
          ---
          
          #### 4. **Built-in Search & Line Copy** 🔍
          
          **Problem:** Finding info requires manual scrolling or complex grep through SSH. Web UI doesn't allow copying single lines.
          
